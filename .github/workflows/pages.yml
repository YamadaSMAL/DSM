name: GitHub Pages
# Deploy only the commit that the Validate workflow (type check, unit, e2e, subpath) has already passed on main.
# Running the browser tests once per commit avoids a second Playwright browser install.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Enable the repository variable only after deciding the public destination.
    # A manual run deploys the current main without re-running the browser tests.
    if: >-
      vars.DSM_PAGES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for the configured destination
        env:
          DSM_BASE_PATH: ${{ vars.DSM_BASE_PATH }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$DSM_BASE_PATH" ]; then
            echo 'Set DSM_BASE_PATH to / or /repository-name/ before deployment.'
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
