name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Playwright 1.56's browser unzip hangs under Node 26; install the browser with Node 24, then return to .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # Download the browser from the Playwright CDN (fast). Retry a stalled attempt.
      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium && exit 0
            echo "Playwright browser download attempt $attempt failed or stalled; retrying."
          done
          exit 1
      # System libraries are already on ubuntu-24.04; install-deps only adds fonts (incl. Japanese) and
      # mesa upgrades from the Ubuntu mirror, which is sometimes very slow. Best effort, never blocks.
      - name: Install Playwright system dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 8
        run: npx playwright install-deps chromium
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm run test:e2e
      - run: npm run test:subpath
